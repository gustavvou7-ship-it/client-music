name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Descompactar projeto
      run: unzip client-music-github.zip -d .

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Rodar script Python
      run: python3 scripts/package-android.py

    - name: Compilar APK
      run: gradle -p android assembleDebug

    - name: Enviar APK
      uses: actions/upload-artifact@v4
      with:
        name: client-music-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
